  surface: { fa: کیف، پاکت خرید و تی‌شرت, en: Pouches, gift bags and a shirt }
  alt:
    fa: سه کیف لوازم با طراحی سیاه‌وسفید، دو پاکت خرید با پیکره‌ی مرکبی و پیکره‌ی قرمز و آبی، و تی‌شرت قرمز با پیکره‌ی سفید روی مانکن.
    en: Three pouches with black and white drawings, two gift bags with an ink figure and a red and blue figure, and a red shirt with a white figure on a mannequin.
- id: night-hoodies
  order: 6
