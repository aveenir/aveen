  image: ../assets/pdf/illustration-postcards.jpg
  surface: { fa: کارت‌پستال‌ها, en: Postcards }
  alt:
    fa: سه کارت‌پستال با طراحی مرکب سیاه از پیکره‌های درهم‌پیچیده، کنار کارت‌های خط‌دار با منظره‌ی کوه.
    en: Three postcards with black ink drawings of curled-up figures, beside lined cards with mountain landscapes.
- id: bags-and-shirt
