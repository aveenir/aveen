    fa: زنی از پشت با دو هودی؛ کرم با پیکره‌ی قرمز در میان خطوط سیاه، و نارنجی با پیکره‌ی خطی روی زمینه‌ی آبی.
    en: A woman seen from behind in two hoodies; cream with a red figure inside black lines, and rust with a line figure on a blue pattern.
