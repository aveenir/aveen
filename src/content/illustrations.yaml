# Personal illustrations shown on products (portfolio p.18–25). Images: TD-001.
# Paths are relative to this file.
- id: tshirts
  order: 1
  wide: true
  image: ../assets/pdf/illustration-tshirts.jpg
  surface: { fa: تی‌شرت‌ها, en: T-shirts }
  alt:
    fa: شش تی‌شرت آویزان؛ یکی سبز با پیکره‌ی قرمز و آبی و بقیه سفید با طراحی‌های خطی و هاشور مرکب سیاه.
    en: Six hanging T-shirts; one green with a red and blue figure, the rest white with black ink line drawings and hatching.
- id: hoodies
  order: 2
  image: ../assets/pdf/illustration-hoodies.jpg
  surface: { fa: هودی‌ها, en: Hoodies }
  alt:
    fa: دو هودی؛ آبی با گره‌ای از خطوط رنگی و سفید با پیکره‌ای خطی که روی لبه‌ی سرمه‌ای نشسته است.
    en: Two hoodies; a blue one with a knot of coloured lines and a white one with a line figure sitting on a navy hem.
- id: tote-yellow
  order: 3
  image: ../assets/pdf/illustration-tote-yellow.jpg
  surface: { fa: ساک پارچه‌ای, en: Tote bag }
  alt:
    fa: ساک پارچه‌ای زرد در دست، با پیکره‌ای نشسته از خطوط آبی، قرمز و سبز.
    en: A yellow tote bag held by hand, with a seated figure in blue, red and green lines.
- id: postcards
  order: 4
