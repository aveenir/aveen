body:
  fa: |
    نشانه‌ی فرادید صنعت غدیر یک حرف F نرم است: مربعی با گوشه‌های گرد که یک برش برگ‌مانند از آن جدا شده. اسکیس‌ها از F خطی و نیم‌دایره شروع شدند و به فرمی رسیدند که در اندازه‌ی کوچک هم خوانده می‌شود.

    سبزآبی‌های ملایم و گرادیان نرم، چهره‌ای آرام و قابل‌اعتماد به برندی صنعتی می‌دهند؛ از زونکن و تابلو تا بدنه‌ی کامیون.
  en: |
    The Faradid Sanat Ghadir mark is a soft letter F: a rounded square with a leaf-like cut taken out of it. The sketches begin with a linear F and a half circle and end in a form that still reads at small sizes.

    Gentle teals and a soft gradient give an industrial brand a calm, trustworthy face, from binders and signage to the side of a truck.
