title:
  fa: دقیق
  en: Daghigh
kind:
  fa: لوگوی
  en: Logo
body:
  fa: |
    نشانه‌ی دقیق از کنار هم گذاشتن حرف D و یک قاب هشت‌ضلعی تراش‌خورده ساخته شده است. اسکیس‌ها از ده‌ها شکل ساده شروع شدند تا به فرمی رسیدند که هم مثل یک حرف خوانده شود و هم مثل یک سنگ تراش‌خورده.

    پالت کرم، طلایی و سبز تیره، حس ظرافت و دقت را روی جعبه، کیسه‌ی خرید و تابلوی فروشگاه حفظ می‌کند.
  en: |
    The Daghigh mark joins the letter D with a faceted octagonal frame. The sketches start from a dozen simple shapes and narrow down to a form that reads as a letter and as a cut stone at the same time.

    A cream, gold and deep green palette keeps the feeling of precision and care across the box, shopping bag and shop sign.
palette: ['#F2F5EC', '#B6A86B', '#0D1B1C']
