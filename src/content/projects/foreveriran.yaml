body:
  fa: |
    فوراور ایران در حوزه‌ی سلامت، پوست و مو فعالیت می‌کند. به دلیل محدودیت در دسترسی به تصاویر باکیفیت محصولات، تصاویر جمع‌آوری، بهبود کیفیت و سه‌بعدی‌سازی شدند و به‌صورت فوتومونتاژ طراحی شدند.

    محصولات کنار عناصر انسانی و پس‌زمینه‌های مرتبط قرار گرفتند تا فضایی حرفه‌ای، بهداشتی و ترغیب‌کننده برای معرفی‌شان ساخته شود.
  en: |
    ForeverIran works in health, skin and hair care. Good product photos were hard to come by, so I gathered images, improved their quality, rebuilt the products in 3D and composed them as photomontages.

    Placing each product next to people and a matching background gives the posts a professional, clean and persuasive feel.
