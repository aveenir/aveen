  en: ParsHava
kind:
  fa: پست‌ها و استوری‌های
  en: Posts and Stories
body:
  fa: |
    در طراحی قالب پارس هوا از المان‌هایی مثل فرمول‌های شیمیایی، ساختارهای مرتبط با گاز و جلوه‌های بصری بخار استفاده شده است.

    با توجه به ماهیت تخصصی و فنی این صنعت، برای جذاب‌تر شدن تصویر و ترغیب مخاطب به دیدن محتوا از تصاویر ترکیبی و تکنیک کلاژ بهره گرفته شده است.
  en: |
    The ParsHava template draws on chemical formulas, gas-related structures and the look of vapour.

    The industry is technical and specialised, so composite images and collage make the posts more inviting and give people a reason to stop and read.
