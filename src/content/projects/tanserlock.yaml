body:
  fa: |
    تنسرلاک یک قفل هوشمند و جایگزین قفل‌های سنتی است. در قالب سوشال این پروژه از شکل‌های هندسی مثلثی استفاده شده است تا حس حرکت، پویایی و پیشرو بودن محصول را منتقل کند.

    برای تمایز بصری و هماهنگی با ترندهای روز، بخشی از تصاویر با هوش مصنوعی Midjourney و منابع Freepik تهیه شده‌اند. مخاطبان برند حرفه‌ای و سازمانی‌اند؛ پس فضای طراحی جدی است و تصاویر رئال و روایت‌محور، محتوا را جذاب‌تر می‌کنند.
  en: |
    Tanserlock makes smart locks that replace traditional ones. The social template uses triangular geometric shapes to carry a sense of movement, energy and a product that is ahead of its field.

    To stand out and stay current, some images were made with Midjourney or sourced from Freepik. The audience is professional and corporate, so the tone is serious, and realistic, story-led images keep the content engaging.
