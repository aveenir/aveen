body:
  fa: |
    نشانه‌ی نوربو گروپ از دو بلوک درهم‌قفل‌شده ساخته شده که حرف‌های N و G را کنار هم می‌سازند. اسکیس‌ها بین فرم‌های توپر و حروف به‌هم‌چسبیده رفت‌وبرگشت کردند تا نشانه‌ای ساده و محکم به دست آمد.

    سرمه‌ای و زیتونی دو بلوک را از هم جدا می‌کنند و روی تقویم رومیزی، ساک پارچه‌ای و نمای ساختمان هم خوانا می‌مانند.
  en: |
    The Norbu Group mark is two interlocking blocks that together form the letters N and G. The sketches move back and forth between solid shapes and joined letters until a simple, sturdy mark remains.

    Indigo and olive keep the two blocks distinct, and the mark stays legible on a desk calendar, a tote bag and a building facade.
palette: ['#F1F1F0', '#BBB77A', '#0D1B1C', '#2A2A65']
